sonar.organization={{parameters.sonarOrganization}}
sonar.projectKey={{parameters.repositoryName}}
sonar.projectName={{parameters.repositoryName}}
sonar.projectVersion=0.0.1

sonar.language=ts
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/index.*,**/*.error.ts,**/logger.ts,**/app.ts,**/swagger.ts,**/*Connection.*,**/example.*,**/*.config.*,**/*Config.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
