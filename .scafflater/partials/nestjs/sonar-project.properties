sonar.organization={{parameters.sonarOrganization}}
sonar.projectKey={{parameters.repositoryName}}
sonar.projectName={{parameters.repositoryName}}
sonar.projectVersion=0.0.1

sonar.language=ts
sonar.sourceEncoding=UTF-8

sonar.sources=src/
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/index.*,**/*.module.*,**/*.config.*,**/*Config.*,**/*.logger.*,**/*Connection.*,**/example.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
