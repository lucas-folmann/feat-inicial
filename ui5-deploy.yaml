specVersion: '2.5'
metadata:
  name: br.com.grupoboticario.sd.materialnbs
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - '/test/**'
      - '/localService/**'
  customTasks:
    - name: webide-extension-task-updateManifestJson
      afterTask: replaceVersion
      configuration:
        appFolder: webapp
        destDir: dist
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: materialnbs
        additionalFiles:
          - xs-app.json
