# @scf-option {"ignore": true}
version: 2

registries:
  aws-ecr-docker:
    type: docker-registry
    url: 414700354900.dkr.ecr.us-east-1.amazonaws.com
    username: ${{ secrets.CORE_SHR_ECR_AWS_ACCESS_KEY_ID }}
    password: ${{ secrets.CORE_SHR_ECR_AWS_ACCESS_SECRET_KEY }}
  github-packages-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.GHA_PACKAGES }}

updates:
  - package-ecosystem: docker
    directory: /.scafflater/init/dockerfiles
    open-pull-requests-limit: 10
    registries:
      - aws-ecr-docker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /.scafflater/partials/fastify
    open-pull-requests-limit: 10
    registries:
      - github-packages-npm
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /.scafflater/partials/nestjs
    open-pull-requests-limit: 10
    registries:
      - github-packages-npm
    schedule:
      interval: weekly
    groups:
      non-major:
        update-types:
          - minor
          - patch
